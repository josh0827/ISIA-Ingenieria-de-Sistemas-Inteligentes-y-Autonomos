# Comprobacion automatica de cada cambio.
#
# Compila el sitio entero en cada pull request. Si alguien sube algo que no
# compila, GitHub lo marca en rojo antes de que nadie lo revise, y no hay que
# fiarse de que cada uno se acuerde de pasar "npm run build" en su equipo.
#
# Funciona en cualquier plan de GitHub y no necesita configurar nada.

name: Compilar

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci en vez de npm install: instala exactamente lo que dice
      # package-lock.json, sin actualizar nada por su cuenta.
      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      # Los tests no necesitan Supabase: validan esquemas, roles e imágenes.
      - run: npm test

      - run: npm run build

      # Informativo: avisa de vulnerabilidades conocidas en dependencias de produccion
      # sin bloquear el cambio (un aviso nuevo no siempre es culpa de este PR).
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
